<?xml version="1.0" encoding="UTF-8"?>
<!-- Synapse master app icon (512x512). Used for PWA, Play Store listing, favicon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.22" />
      <stop offset="50%" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b" />
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square base (matches Play Store icon mask) -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#brand)" />
  <!-- Subtle top sheen -->
  <rect x="0" y="0" width="512" height="200" rx="112" fill="url(#sheen)" />

  <!-- Glowing dot accents (synapse motif) -->
  <circle cx="120" cy="120" r="8" fill="white" opacity="0.5" />
  <circle cx="400" cy="100" r="6" fill="white" opacity="0.35" />
  <circle cx="450" cy="420" r="10" fill="white" opacity="0.4" />
  <circle cx="80" cy="380" r="7" fill="white" opacity="0.3" />

  <!-- Synapse "S" — clean geometric mark -->
  <g filter="url(#glow)">
    <path d="
      M 350 168
      C 350 138, 320 110, 280 110
      L 232 110
      C 192 110, 162 138, 162 168
      C 162 198, 192 226, 232 226
      L 280 226
      C 320 226, 350 254, 350 284
      C 350 314, 320 342, 280 342
      L 232 342
      C 192 342, 162 314, 162 284
    "
      fill="none"
      stroke="white"
      stroke-width="42"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Connection nodes at the ends -->
    <circle cx="232" cy="110" r="22" fill="white" />
    <circle cx="280" cy="342" r="22" fill="white" />
  </g>
</svg>
