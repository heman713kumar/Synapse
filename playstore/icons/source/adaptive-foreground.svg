<?xml version="1.0" encoding="UTF-8"?>
<!-- Adaptive icon FOREGROUND layer (432x432).
     All visible art stays inside center 264x264 safe zone — anything outside
     may be cropped by the launcher's mask (circle, squircle, square…). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 432" width="432" height="432">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Faint guide circle for the safe zone (NOT rendered in production —
       remove or comment out before exporting). Comment retained for reference:
       <circle cx="216" cy="216" r="132" fill="none" stroke="#fff" stroke-opacity="0.15" /> -->

  <!-- S-mark, slightly smaller scale so it sits comfortably inside safe zone -->
  <g transform="translate(0, 6)" filter="url(#glow)">
    <path d="
      M 296 158
      C 296 134, 272 112, 240 112
      L 200 112
      C 168 112, 144 134, 144 158
      C 144 182, 168 204, 200 204
      L 240 204
      C 272 204, 296 226, 296 250
      C 296 274, 272 296, 240 296
      L 200 296
      C 168 296, 144 274, 144 250
    "
      fill="none"
      stroke="white"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="200" cy="112" r="18" fill="white" />
    <circle cx="240" cy="296" r="18" fill="white" />
  </g>
</svg>
