<?xml version="1.0" encoding="UTF-8"?>
<!-- Launch splash screen — 1242×2208 (9:16) — shown ~500ms while TWA loads. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1242 2208" width="1242" height="2208">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0F" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>
  <rect width="1242" height="2208" fill="url(#bg)" />

  <!-- Centered logo -->
  <g transform="translate(308, 882)">
    <rect width="626" height="626" rx="140" fill="url(#brand)" />
    <g transform="translate(95, 80) scale(0.92)">
      <path d="
        M 350 168
        C 350 138, 320 110, 280 110
        L 232 110
        C 192 110, 162 138, 162 168
        C 162 198, 192 226, 232 226
        L 280 226
        C 320 226, 350 254, 350 284
        C 350 314, 320 342, 280 342
        L 232 342
        C 192 342, 162 314, 162 284
      "
        fill="none" stroke="white" stroke-width="42"
        stroke-linecap="round" stroke-linejoin="round"
      />
      <circle cx="232" cy="110" r="22" fill="white" />
      <circle cx="280" cy="342" r="22" fill="white" />
    </g>
  </g>

  <!-- Wordmark below -->
  <text x="621" y="1700" font-family="Inter, sans-serif" font-size="98" font-weight="800"
        fill="white" text-anchor="middle" letter-spacing="-2">Synapse</text>
  <text x="621" y="1770" font-family="Inter, sans-serif" font-size="34"
        fill="white" fill-opacity="0.7" text-anchor="middle">Ideas. Built together.</text>
</svg>
