<?xml version="1.0" encoding="UTF-8"?>
<!-- Play Store feature graphic — 1024×500 required by listing.
     Shown at top of store page. No text guaranteed safe-zone, so keep
     key copy roughly centered. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0F" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <radialGradient id="glow1" cx="0.25" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="0.75" cy="0.6" r="0.5">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </radialGradient>
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)" />
  <rect width="1024" height="500" fill="url(#glow1)" />
  <rect width="1024" height="500" fill="url(#glow2)" />

  <!-- Sprinkled "node" dots (network motif) -->
  <g fill="white" opacity="0.4">
    <circle cx="80"  cy="80"  r="3" />
    <circle cx="180" cy="40"  r="2" />
    <circle cx="950" cy="60"  r="3" />
    <circle cx="880" cy="180" r="2" />
    <circle cx="60"  cy="430" r="2" />
    <circle cx="940" cy="450" r="3" />
    <circle cx="500" cy="60"  r="2" />
    <circle cx="160" cy="420" r="2" />
  </g>

  <!-- App icon (rounded square) -->
  <g transform="translate(80, 130)">
    <rect width="240" height="240" rx="56" fill="url(#brand)" filter="url(#iconShadow)" opacity="0.6" />
    <rect width="240" height="240" rx="56" fill="url(#brand)" />
    <g transform="translate(40, 32) scale(0.4)">
      <path d="
        M 350 168
        C 350 138, 320 110, 280 110
        L 232 110
        C 192 110, 162 138, 162 168
        C 162 198, 192 226, 232 226
        L 280 226
        C 320 226, 350 254, 350 284
        C 350 314, 320 342, 280 342
        L 232 342
        C 192 342, 162 314, 162 284
      "
        fill="none" stroke="white" stroke-width="42"
        stroke-linecap="round" stroke-linejoin="round"
      />
      <circle cx="232" cy="110" r="22" fill="white" />
      <circle cx="280" cy="342" r="22" fill="white" />
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <g font-family="Inter, system-ui, sans-serif" fill="white">
    <text x="370" y="190" font-size="84" font-weight="800" letter-spacing="-2">Synapse</text>
    <text x="370" y="246" font-size="28" font-weight="400" opacity="0.85">
      Where ideas meet the people who build them.
    </text>
    <!-- Feature pills -->
    <g transform="translate(370, 290)" font-size="14" font-weight="600" letter-spacing="0.5">
      <rect width="90" height="30" rx="15" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.2" />
      <text x="45" y="20" text-anchor="middle">AI COACH</text>
      <g transform="translate(102, 0)">
        <rect width="120" height="30" rx="15" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.2" />
        <text x="60" y="20" text-anchor="middle">COLLABORATION</text>
      </g>
      <g transform="translate(234, 0)">
        <rect width="110" height="30" rx="15" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.2" />
        <text x="55" y="20" text-anchor="middle">REAL-TIME CHAT</text>
      </g>
      <g transform="translate(356, 0)">
        <rect width="90" height="30" rx="15" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.2" />
        <text x="45" y="20" text-anchor="middle">KANBAN</text>
      </g>
    </g>
  </g>
</svg>
